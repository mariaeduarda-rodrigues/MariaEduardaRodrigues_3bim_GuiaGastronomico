<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pratos - DEVORA</title>
    <link rel="stylesheet" href="prato.css">
</head>

<body onload="inicializar()">
    <header>
        <h1>🍝 Cadastro de Pratos</h1>
        <p>Cadastre e consulte pratos do nosso guia gastronômico.</p>
        <nav>
            <a href="../menu/menu.html">Início</a>
            <a href="../prato/prato.html">Pratos</a>
            <a href="../categoria/categoria.html">Categorias</a>
            <a href="../usuario/usuario.html">Usuários</a>
            <a href="../medida/medida.html">Medidas</a>
        </nav>
    </header>

    <main class="container-master">
        <div class="conteudo-principal">
            <section class="form-esquerda">
                <h2>Informações do Prato</h2>

                <label for="inputId_prato">ID do Prato</label>
                <div class="linha-id">
                    <input type="text" id="inputId_prato" placeholder="Ex: 1">
                    <input type="button" value="Procurar" id="btProcure" onclick="procure()">
                    <input type="button" value="Inserir" id="btInserir" onclick="inserir()" style="display:none;">
                    <input type="button" value="Alterar" id="btAlterar" onclick="alterar()" style="display:none;">
                    <input type="button" value="Excluir" id="btExcluir" onclick="excluir()" style="display:none;">
                </div>

                <label for="inputNome_prato">Nome do Prato</label>
                <input type="text" id="inputNome_prato" placeholder="Ex: Lasanha à Bolonhesa">

                <label for="selectId_categoria">Categoria do Prato</label>
                <select id="selectId_categoria" disabled>
                   <option value="">Carregando...</option>
                </select>

                <label for="selectId_medida">Unidade de Medida</label>
                <select id="selectId_medida" disabled>
                    <option value="">Carregando...</option>
                </select>

                <label for="inputQuantidade_estoque_prato">Quantidade em Estoque</label>
                <input type="number" id="inputQuantidade_estoque_prato">

                <label for="inputPreco_unitario_prato">Preço do Prato (R$)</label>
                <input type="number" step="0.01" id="inputPreco_unitario_prato">

                <div id="divAviso">Informe o ID do prato e clique em Procurar.</div>

                <div class="botoes-acao">
                    <input type="button" value="Salvar" id="btSalvar" onclick="salvar()" style="display:none;">
                    <input type="button" value="Cancelar" id="btCancelar" onclick="cancelarOperacao()" style="display:none;">
                </div>
            </section>

            <aside class="form-direita">
                <h2>📷 Foto do Prato</h2>
                

                <div class="img-container">
                    <img id="imgPrato" src="http://localhost:3000/imagens/silhueta.jpg" alt="Foto do prato">
               
                </div>
            </aside>
        </div>

        <section class="lista-prato">
            <h2>🍽️ Pratos cadastrados</h2>
            <div id="outputSaida">Carregando...</div>
        </section>
    </main>

    <script src="prato.js"></script>
</body>
</html>
